name: X Auto Post

on:
  schedule:
    # 毎日 9:00 JST（0:00 UTC）
    - cron: '0 0 * * *'
    # 毎日 18:00 JST（9:00 UTC）
    - cron: '0 9 * * *'
  workflow_dispatch:  # 手動実行も可能にする

permissions:
  contents: write  # 投稿履歴のコミットバックに必要

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 依存ライブラリをインストール
        run: pip install -r requirements.txt

      - name: Cookieファイルを復元
        run: echo '${{ secrets.COOKIES_JSON }}' > cookies.json

      - name: 自動投稿を実行
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py

      - name: 投稿履歴をコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # ファイルが存在しない場合は空の履歴を作成
          if [ ! -f post_history.json ]; then
            echo "[]" > post_history.json
          fi
          git add -f post_history.json
          git diff --staged --quiet || git commit -m "投稿履歴を更新"
          git push